services:
  auth-db:
    image: postgres:16
    container_name: autoops-auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: AutoOpsAuth
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  workflow-db:
    image: postgres:16
    container_name: autoops-workflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: AutoOpsWorkflow
    ports:
      - "5433:5432"
    volumes:
      - workflow_db_data:/var/lib/postgresql/data

volumes:
  auth_db_data:
  workflow_db_data: